name: 'Terraform Destroy'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (confirm by typing: DESTROY)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  terraform-destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.TOKEN }}
      AWS_REGION: eu-west-2
    environment: production

    defaults:
      run:
        shell: bash

    steps:
    - name: Verify Destroy Confirmation
      run: |
        if [ "${{ github.event.inputs.environment }}" != "DESTROY" ]; then
          echo "❌ Destruction cancelled. Please confirm by typing 'DESTROY' in the environment input."
          exit 1
        fi
        echo "⚠️ WARNING: This will destroy all infrastructure managed by Terraform!"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Destroy Plan
      run: terraform plan -destroy -input=false

    - name: Terraform Destroy
      run: terraform destroy -auto-approve -input=false
